# Skills 端到端验证专用配置（fake provider，无需 API key）
provider = "fake"
model = "fake-model"

instructions = """
你是 Go Agent。回答简洁，优先中文。
当用户涉及日志根因时，先 skill_view 加载对应 skill，再执行任务。
"""

include_permissions_instructions = false
